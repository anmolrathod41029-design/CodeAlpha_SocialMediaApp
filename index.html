<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe ✦ Social</title>
    <style>
        :root {
            --bg: #f0f2f5; --surf: #ffffff; --surf2: #f8f9fa; --text: #1a1a1a; --muted: #65676b;
            --accent: #7c6dfa; --border: #e4e6eb; --grad: linear-gradient(135deg, #7c6dfa, #fa6d9a);
        }
        [data-theme="dark"] {
            --bg: #0b0e11; --surf: #15181c; --surf2: #1e2126; --text: #f5f5f5; --muted: #a0a0a0; --border: #2f3336;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.2s; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        /* Nav & Layout */
        nav { height: 60px; background: var(--surf); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top:0; z-index:100; border-bottom: 1px solid var(--border); }
        .app-container { display: grid; grid-template-columns: 240px 1fr 320px; max-width: 1250px; margin: 0 auto; gap: 20px; padding: 20px; }
        
        /* Stories */
        .stories-row { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .story-card { min-width: 75px; text-align: center; cursor: pointer; position: relative; }
        .story-ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: var(--grad); margin: 0 auto 5px; }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--surf); object-fit: cover; }
        .add-btn-circle { position: absolute; bottom: 20px; right: 10px; background: var(--accent); color: white; border-radius: 50%; width: 20px; height: 20px; border: 2px solid var(--surf); font-size: 14px; font-weight: bold; }

        /* Feed Components */
        .card { background: var(--surf); border-radius: 12px; border: 1px solid var(--border); padding: 15px; margin-bottom: 20px; }
        .composer textarea { width: 100%; border: none; background: var(--surf2); border-radius: 8px; padding: 12px; color: var(--text); resize: none; outline: none; font-size: 1rem; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .v-check { color: #1d9bf0; font-size: 14px; }
        .post-img { width: 100%; border-radius: 10px; margin: 10px 0; max-height: 450px; object-fit: cover; }
        .actions { display: flex; gap: 20px; padding-top: 10px; color: var(--muted); border-top: 1px solid var(--border); }
        .action { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .liked { color: #f91880; }

        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--surf); width: 100%; max-width: 450px; border-radius: 16px; padding: 25px; position: relative; }
        .tab-btn { padding: 8px 15px; cursor: pointer; border: none; background: var(--surf2); color: var(--text); border-radius: 5px; }
        .tab-btn.active { background: var(--accent); color: white; }
        .story-preview { height: 250px; background: var(--surf2); border: 2px dashed var(--border); border-radius: 10px; margin: 15px 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 50px; display: none; z-index: 3000; animation: slideUp 0.3s forwards; }

        @keyframes slideUp { from { bottom: -50px; } to { bottom: 20px; } }
        @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } aside { display: none; } }
    </style>
</head>
<body>

<nav>
    <h2 style="background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer;" onclick="location.reload()">Vibe ✦</h2>
    <div style="display:flex; gap:15px; align-items:center;">
        <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:20px;">🌓</button>
        <div style="position:relative; cursor:pointer;" onclick="showToast('🔔 3 New Notifications')">
            🔔<span style="position:absolute; top:-5px; right:-5px; background:red; color:white; font-size:10px; padding:2px 5px; border-radius:10px;">3</span>
        </div>
        <img src="https://i.pravatar.cc/150?img=12" class="avatar" style="width:35px; height:35px;">
    </div>
</nav>

<div class="app-container">
    <aside>
        <div class="card">
            <div style="display:flex; flex-direction:column; gap:15px; font-weight:600;">
                <p>🏠 Home</p><p>🔍 Explore</p><p>👤 Profile</p><p>⚙️ Settings</p>
            </div>
        </div>
    </aside>

    <main>
        <div class="stories-row" id="storyRow"></div>

        <div class="card">
            <textarea id="pText" placeholder="Share a vibe..." rows="2"></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <div style="cursor:pointer;" onclick="toggleEmoji()">😊</div>
                <button class="tab-btn active" style="padding:6px 20px;" onclick="addPost()">Post</button>
            </div>
            <div id="emojiBox" style="display:none; margin-top:10px; gap:8px;">
                <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('😂')">😂</span>
            </div>
        </div>

        <div id="feed"></div>
    </main>

    <aside>
        <div class="card">
            <h4 style="margin-bottom:10px;">Who to follow</h4>
            <div id="followList"></div>
        </div>
    </aside>
</div>

<div class="modal" id="storyModal">
    <div class="modal-content">
        <h3>Create Story</h3>
        <div style="display:flex; gap:10px; margin:15px 0;">
            <button class="tab-btn active" id="tUp" onclick="setSTab('up')">Upload</button>
            <button class="tab-btn" id="tUrl" onclick="setSTab('url')">URL</button>
        </div>
        <div id="sPrev" class="story-preview">
            <input type="file" id="fInp" style="display:none" onchange="hdlFile(event)">
            <p onclick="document.getElementById('fInp').click()">Click to upload 📷</p>
            <input type="text" id="uInp" placeholder="Paste image URL..." style="display:none; width:80%; padding:8px; border-radius:5px; border:1px solid var(--border);">
        </div>
        <textarea id="sCap" placeholder="Add a caption..." style="width:100%; padding:10px; border-radius:8px; background:var(--surf2); border:none;"></textarea>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="tab-btn active" style="flex:1" onclick="submitStory()">Share Story 🚀</button>
            <button class="tab-btn" onclick="clsModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const USERS = [
        {id:0, name:"Alex Rivera", handle:"@alex", avatar:"https://i.pravatar.cc/150?img=12", v:true},
        {id:1, name:"Zoe Chen", handle:"@zoe_designs", avatar:"https://i.pravatar.cc/150?img=47", v:true},
        {id:2, name:"Marcus Webb", handle:"@mwebb", avatar:"https://i.pravatar.cc/150?img=57", v:false},
        {id:3, name:"Luna Park", handle:"@luna", avatar:"https://i.pravatar.cc/150?img=44", v:false}
    ];

    let POSTS = [
        {id:1, uId:1, text:"Building something cool today! ✨", img:"https://picsum.photos/seed/p1/600/400", likes:85, liked:false},
        {id:2, uId:2, text:"The view from the studio is unmatched.", img:"https://picsum.photos/seed/p2/600/400", likes:32, liked:false}
    ];

    let STORIES = [
        {uId:1, img:"https://picsum.photos/seed/s1/400/700", cap:"Work mode"},
        {uId:3, img:"https://picsum.photos/seed/s2/400/700", cap:"Travels"}
    ];

    let sMode = 'up';
    let sImg = '';

    function toggleTheme(){
        const b = document.body;
        b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark');
    }

    function renderStories(){
        const r = document.getElementById('storyRow');
        r.innerHTML = `<div class="story-card" onclick="openStoryModal()">
            <div class="story-ring"><img src="${USERS[0].avatar}"></div>
            <div class="add-btn-circle">+</div><small>Your Story</small>
        </div>` + STORIES.map(s => `
            <div class="story-card">
                <div class="story-ring"><img src="${USERS[s.uId].avatar}"></div>
                <small>${USERS[s.uId].name.split(' ')[0]}</small>
            </div>`).join('');
    }

    function renderPosts(){
        const f = document.getElementById('feed');
        f.innerHTML = POSTS.map(p => `
            <div class="post card">
                <div class="post-header">
                    <img src="${USERS[p.uId].avatar}" class="avatar">
                    <div>
                        <strong>${USERS[p.uId].name} ${USERS[p.uId].v?'<span class="v-check">✔</span>':''}</strong><br>
                        <small style="color:var(--muted)">${USERS[p.uId].handle}</small>
                    </div>
                </div>
                <p>${p.text}</p>
                ${p.img ? `<img src="${p.img}" class="post-img">`:''}
                <div class="actions">
                    <div class="action ${p.liked?'liked':''}" onclick="like(${p.id})">❤️ ${p.likes}</div>
                    <div class="action" onclick="showToast('💬 Comments coming soon')">💬 0</div>
                    <div class="action" onclick="showToast('🔁 Reposted')">🔁</div>
                </div>
            </div>`).join('');
    }

    function renderFollow(){
        document.getElementById('followList').innerHTML = USERS.slice(1).map(u => `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div style="display:flex; gap:10px; align-items:center;">
                    <img src="${u.avatar}" class="avatar" style="width:30px; height:30px;">
                    <small><b>${u.name}</b></small>
                </div>
                <button class="tab-btn" style="padding:2px 10px; font-size:12px;" onclick="showToast('Following ${u.name}')">Follow</button>
            </div>`).join('');
    }

    function addPost(){
        const t = document.getElementById('pText');
        if(!t.value.trim()) return;
        POSTS.unshift({id:Date.now(), uId:0, text:t.value, img:null, likes:0, liked:false});
        t.value=''; renderPosts(); showToast('✨ Post shared!');
    }

    function like(id){
        const p = POSTS.find(x => x.id===id);
        p.liked = !p.liked; p.likes += p.liked?1:-1; renderPosts();
    }

    function openStoryModal(){ document.getElementById('storyModal').classList.add('active'); }
    function clsModal(){ document.getElementById('storyModal').classList.remove('active'); }

    function setSTab(m){
        sMode = m; 
        document.getElementById('tUp').classList.toggle('active', m==='up');
        document.getElementById('tUrl').classList.toggle('active', m==='url');
        document.getElementById('fInp').style.display = m==='up'?'none':'none';
        document.getElementById('uInp').style.display = m==='url'?'block':'none';
        document.getElementById('sPrev').innerHTML = m==='up'?'<p onclick="document.getElementById(\'fInp\').click()">Click to upload 📷</p>':'<input type="text" id="uInp" placeholder="Paste URL..." style="width:80%; padding:8px;">';
    }

    function hdlFile(e){
        const f = e.target.files[0];
        const r = new FileReader();
        r.onload = (ev) => {
            sImg = ev.target.result;
            document.getElementById('sPrev').innerHTML = `<img src="${sImg}" style="width:100%; height:100%; object-fit:cover; border-radius:10px;">`;
        };
        r.readAsDataURL(f);
    }

    function submitStory(){
        if(sMode === 'url') sImg = document.getElementById('uInp').value || "https://picsum.photos/400/700";
        if(!sImg) sImg = "https://picsum.photos/400/700";
        STORIES.unshift({uId:0, img:sImg, cap:document.getElementById('sCap').value});
        renderStories(); clsModal(); showToast('🚀 Story uploaded!');
    }

    function showToast(msg){
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(()=>t.style.display='none', 2500);
    }

    function toggleEmoji(){ const b = document.getElementById('emojiBox'); b.style.display = b.style.display==='none'?'flex':'none'; }
    function addEmoji(e){ document.getElementById('pText').value += e; }

    renderStories(); renderPosts(); renderFollow();
</script>
</body>
</html>
