<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe — Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ===== CSS VARIABLES & RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #13131a;
      --surface2:  #1c1c27;
      --border:    rgba(255,255,255,0.07);
      --text:      #f0f0ff;
      --muted:     #7a7a9a;
      --accent:    #7c6dfa;
      --accent2:   #fa6d9a;
      --accent3:   #6dfac8;
      --grad:      linear-gradient(135deg, #7c6dfa, #fa6d9a);
      --grad2:     linear-gradient(135deg, #6dfac8, #7c6dfa);
      --glow:      0 0 30px rgba(124,109,250,0.25);
      --shadow:    0 8px 32px rgba(0,0,0,0.4);
      --radius:    16px;
      --navbar-h:  64px;
      --sidebar-w: 260px;
      font-family: 'Sora', sans-serif;
    }
    [data-theme="light"] {
      --bg:       #f2f2fa;
      --surface:  #ffffff;
      --surface2: #ebebf8;
      --border:   rgba(0,0,0,0.08);
      --text:     #0f0f1a;
      --muted:    #6b6b8a;
      --shadow:   0 8px 32px rgba(0,0,0,0.1);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

    /* ===== NAVBAR ===== */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--navbar-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: rgba(10,10,15,0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="light"] #navbar { background: rgba(255,255,255,0.7); }

    .nav-logo {
      font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    .nav-search {
      position: relative; flex: 1; max-width: 380px; margin: 0 24px;
    }
    .nav-search input {
      width: 100%; padding: 10px 16px 10px 42px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 99px; color: var(--text); font-family: inherit; font-size: 0.875rem;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .nav-search input:focus { border-color: var(--accent); box-shadow: var(--glow); }
    .nav-search .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; font-size: 1rem;
    }
    #search-dropdown {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; display: none; z-index: 200;
    }
    #search-dropdown.open { display: block; }
    .search-result-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      cursor: pointer; transition: background 0.15s;
    }
    .search-result-item:hover { background: var(--surface2); }
    .search-result-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .search-result-item .name { font-size: 0.875rem; font-weight: 600; }
    .search-result-item .handle { font-size: 0.75rem; color: var(--muted); }

    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; font-size: 1.1rem; transition: all 0.2s;
      color: var(--text); position: relative;
    }
    .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--glow); }
    .notif-badge {
      position: absolute; top: -3px; right: -3px; width: 16px; height: 16px;
      background: var(--accent2); border-radius: 50%; font-size: 0.6rem;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
      color: white; border: 2px solid var(--bg);
    }
    .nav-avatar {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      border: 2px solid transparent;
      background: var(--grad) border-box;
      cursor: pointer; transition: transform 0.2s;
      outline: 2px solid var(--accent);
    }
    .nav-avatar:hover { transform: scale(1.08); }

    /* ===== LAYOUT ===== */
    #app {
      display: flex; padding-top: var(--navbar-h);
      min-height: 100vh; max-width: 1400px; margin: 0 auto;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      position: sticky; top: var(--navbar-h); height: calc(100vh - var(--navbar-h));
      overflow-y: auto; padding: 24px 16px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .sidebar-section-title {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--muted); padding: 0 8px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar-link {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border-radius: 12px; cursor: pointer; font-size: 0.9rem; font-weight: 500;
      transition: all 0.15s; color: var(--muted);
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: var(--surface2); color: var(--text);
    }
    .sidebar-link.active { color: var(--accent); }
    .sidebar-link span { font-size: 1.2rem; }

    .suggested-user { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .suggested-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .suggested-user .info { flex: 1; min-width: 0; }
    .suggested-user .name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggested-user .handle { font-size: 0.75rem; color: var(--muted); }
    .follow-btn {
      padding: 5px 14px; border-radius: 99px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--accent); color: var(--accent);
      background: transparent; font-family: inherit; transition: all 0.2s; white-space: nowrap;
    }
    .follow-btn:hover, .follow-btn.following { background: var(--accent); color: white; }
    .follow-btn.following { background: var(--surface2); border-color: var(--border); color: var(--muted); }

    /* ===== FEED ===== */
    #feed { flex: 1; padding: 24px; max-width: 680px; margin: 0 auto; }

    /* ===== STORIES ===== */
    .stories-row {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px;
      scrollbar-width: none;
    }
    .stories-row::-webkit-scrollbar { display: none; }
    .story-card {
      flex-shrink: 0; width: 72px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .story-ring {
      width: 64px; height: 64px; border-radius: 50%; padding: 2.5px;
      background: var(--grad); transition: transform 0.2s, box-shadow 0.2s;
    }
    .story-ring:hover { transform: scale(1.08); box-shadow: var(--glow); }
    .story-ring.seen { background: var(--surface2); }
    .story-inner { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); }
    .story-name { font-size: 0.68rem; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 72px; }
    .story-add .story-ring { background: var(--surface2); display: flex; align-items: center; justify-content: center; }
    .story-add .story-ring-inner {
      width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg);
      background: var(--surface); display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--accent);
    }

    /* ===== COMPOSER ===== */
    .composer {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .composer-top { display: flex; gap: 12px; }
    .composer-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; outline: 2px solid var(--accent); }
    .composer-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: var(--text);
      font-family: inherit; font-size: 0.925rem; resize: none; outline: none;
      min-height: 80px; transition: border-color 0.2s;
    }
    .composer-input:focus { border-color: var(--accent); }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .composer-tools { display: flex; gap: 4px; }
    .composer-tool { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 8px; font-size: 1.1rem; color: var(--muted); transition: all 0.15s; }
    .composer-tool:hover { background: var(--surface2); color: var(--accent); }
    .post-btn {
      padding: 9px 22px; border-radius: 99px; font-size: 0.875rem; font-weight: 600;
      background: var(--grad); border: none; color: white; cursor: pointer; font-family: inherit;
      transition: opacity 0.2s, transform 0.2s; letter-spacing: 0.3px;
    }
    .post-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .post-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .emoji-row { display: none; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 10px; background: var(--surface2); border-radius: 10px; }
    .emoji-row.open { display: flex; }
    .emoji-pick { cursor: pointer; font-size: 1.3rem; transition: transform 0.15s; }
    .emoji-pick:hover { transform: scale(1.3); }

    /* ===== POST CARD ===== */
    .post {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
      box-shadow: var(--shadow); animation: fadeSlide 0.35s ease both;
    }
    @keyframes fadeSlide { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

    .post-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; }
    .post-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; cursor: pointer; outline: 2px solid var(--accent); transition: transform 0.2s; }
    .post-avatar:hover { transform: scale(1.05); }
    .post-meta { flex: 1; }
    .post-name { font-size: 0.925rem; font-weight: 700; cursor: pointer; }
    .post-name:hover { color: var(--accent); }
    .post-handle { font-size: 0.78rem; color: var(--muted); }
    .post-time { font-size: 0.75rem; color: var(--muted); }
    .post-more { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.3rem; padding: 4px 8px; border-radius: 8px; transition: background 0.15s; }
    .post-more:hover { background: var(--surface2); }
    .post-body { padding: 0 20px 14px; line-height: 1.65; font-size: 0.95rem; }
    .post-body .hashtag { color: var(--accent); cursor: pointer; }
    .post-image { width: 100%; max-height: 480px; object-fit: cover; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity 0.2s; }
    .post-image:hover { opacity: 0.92; }

    .post-actions { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
    .action-btn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; border: none; background: none; cursor: pointer; font-size: 0.85rem; color: var(--muted); font-family: inherit; font-weight: 500; transition: all 0.2s; }
    .action-btn:hover { background: var(--surface2); color: var(--text); }
    .action-btn .icon { font-size: 1.1rem; display: inline-block; transition: transform 0.2s; }
    .action-btn.liked { color: #ff4d6d; }
    .action-btn.liked .icon { animation: heartPop 0.3s ease; }
    @keyframes heartPop { 0%{transform:scale(1)} 50%{transform:scale(1.45)} 100%{transform:scale(1)} }
    .action-btn.bookmarked { color: var(--accent); }
    .spacer { flex: 1; }

    /* Comments */
    .comments-section { padding: 0 20px 16px; display: none; }
    .comments-section.open { display: block; }
    .comment-divider { height: 1px; background: var(--border); margin-bottom: 14px; }
    .comment-item { display: flex; gap: 10px; margin-bottom: 12px; }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .comment-bubble { background: var(--surface2); border-radius: 12px; padding: 8px 12px; flex: 1; font-size: 0.85rem; line-height: 1.5; }
    .comment-bubble .c-name { font-weight: 700; font-size: 0.8rem; margin-bottom: 2px; }
    .comment-input-row { display: flex; gap: 8px; margin-top: 10px; }
    .comment-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 8px 16px; color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s; }
    .comment-send { width: 36px; height: 36px; border-radius: 50%; background: var(--grad); border: none; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; color: white; }

    /* ===== RIGHT PANEL ===== */
    #right-panel { width: 300px; flex-shrink: 0; position: sticky; top: var(--navbar-h); height: calc(100vh - var(--navbar-h)); overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }
    .panel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .panel-card h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 14px; }
    .trend-item { padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .trend-tag { font-size: 0.88rem; font-weight: 600; margin: 2px 0; transition: color 0.15s; }
    .trend-count { font-size: 0.75rem; color: var(--muted); }

    /* ===== TOAST ===== */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; font-size: 0.875rem; min-width: 240px; pointer-events: auto; animation: toastIn 0.3s ease both; }
    @keyframes toastIn { from { opacity:0; transform: translateY(12px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
    .toast.hide { animation: toastOut 0.3s ease forwards; }
    @keyframes toastOut { to { opacity:0; transform: translateY(8px) scale(0.95); } }

    /* ===== MODALS ===== */
    #profile-modal, #story-viewer, #add-story-modal { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    #profile-modal.open, #story-viewer.open, #add-story-modal.open { opacity: 1; pointer-events: all; }
    .modal-card, .story-view-card, .add-story-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 420px; max-width: 95vw; overflow: hidden; box-shadow: var(--shadow); transform: scale(0.92); transition: transform 0.25s; }
    .open .modal-card, .open .story-view-card, .open .add-story-card { transform: scale(1); }

    /* Verified badge */
    .verified { color: var(--accent); font-size: 0.9rem; }

    /* Mobile bottom nav */
    #mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(10,10,15,0.9); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 10px 0 env(safe-area-inset-bottom); justify-content: space-around; }
    @media (max-width: 720px) { #sidebar, #right-panel { display: none; } #mobile-nav { display: flex; } body { padding-bottom: 72px; } .nav-search { max-width: 160px; } }
    .mob-nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.4rem; transition: color 0.15s; padding: 4px 16px; }
    .mob-nav-btn.active { color: var(--accent); }
    .mob-nav-btn span.label { font-size: 0.6rem; font-weight: 600; font-family: 'Sora', sans-serif; }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-logo" onclick="scrollToTop()">Vibe ✦</div>
  <div class="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search people..." autocomplete="off" />
    <div id="search-dropdown"></div>

<div id="app">

  <aside id="right-panel">
    <div class="panel-card">
      <h3>🔥 Trending</h3>

</div>

<div id="mobile-nav">

  <button class="mob-nav-btn" onclick="setMobActive(this); openProfile(0)">👤<span class="label">Profile</span></button>

// ===== POST RENDERING ENGINE =====
function renderPosts() {
  const container = document.getElementById('posts-container');
  container.innerHTML = '';
  POSTS.forEach(post => {
    container.appendChild(createPostEl(post));
  });
}

function createPostEl(post) {
  const user = USERS[post.userId];
  const el = document.createElement('div');
  el.className = 'post';
  el.id = `post-${post.id}`;

  const imgHTML = post.image ? `<img class="post-image" src="${post.image}" onclick="window.open(this.src)" />` : '';
  const likedClass = post.liked ? 'liked' : '';
  const bookmarkedClass = post.bookmarked ? 'bookmarked' : '';

  el.innerHTML = `
    <div class="post-header">
      <img class="post-avatar" src="${user.avatar}" onclick="openProfile(${user.id})" />
      <div class="post-meta">
        <div class="post-name" onclick="openProfile(${user.id})">${user.name}</div>
        <div class="post-handle">${user.handle} · ${post.time}</div>
      </div>
    </div>
    <div class="post-body">${post.text}</div>
    ${imgHTML}
    <div class="post-actions">
      <button class="action-btn ${likedClass}" onclick="toggleLike(${post.id})">
        <span class="icon">${post.liked ? '❤️' : '🤍'}</span> <span>${post.likes}</span>
      </button>
      <button class="action-btn" onclick="toggleComments(${post.id})">💬 ${post.comments.length}</button>
      <button class="action-btn ${bookmarkedClass}" onclick="toggleBookmark(${post.id})">🔖</button>
    </div>
    <div class="comments-section" id="comments-${post.id}">
      <div id="comment-list-${post.id}">
        ${post.comments.map(c => `<div class="comment-item"><b>${USERS[c.userId].name}:</b> ${c.text}</div>`).join('')}
      </div>
      <div class="comment-input-row">
        <input class="comment-input" id="ci-${post.id}" placeholder="Reply..." onkeydown="if(event.key==='Enter')submitComment(${post.id})">
      </div>
    </div>`;
  return el;
}

// ===== INTERACTION FUNCTIONS =====
function toggleLike(postId) {
  const post = POSTS.find(p => p.id === postId);
  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;
  renderPosts();
  if(post.liked) toast('❤️', 'Added to liked posts');
}

function toggleBookmark(postId) {
  const post = POSTS.find(p => p.id === postId);
  post.bookmarked = !post.bookmarked;
  renderPosts();
  toast('🔖', post.bookmarked ? 'Saved to bookmarks' : 'Removed from bookmarks');
}

function toggleComments(postId) {
  const section = document.getElementById(`comments-${postId}`);
  section.style.display = section.style.display === 'block' ? 'none' : 'block';
}

function submitComment(postId) {
  const input = document.getElementById(`ci-${postId}`);
  if (!input.value.trim()) return;
  const post = POSTS.find(p => p.id === postId);
  post.comments.push({ userId: 0, text: input.value });
  renderPosts();
  toggleComments(postId);
  toast('💬', 'Comment added!');
}

function publishPost() {
  const ta = document.getElementById('compose-text');
  if (!ta.value.trim()) return;
  const newPost = {
    id: nextPostId++, userId: 0, text: ta.value, image: null,
    likes: 0, liked: false, comments: [], bookmarked: false, time: 'Just now'
  };
  POSTS.unshift(newPost);
  renderPosts();
  ta.value = '';
  document.getElementById('post-btn').disabled = true;
  toast('🚀', 'Post is live!');
        }

function initSearch() {
  const input = document.getElementById('search-input');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { dropdown.classList.remove('open'); return; }

    const results = USERS.filter(u => 
      u.name.toLowerCase().includes(q) || u.handle.toLowerCase().includes(q)

    dropdown.innerHTML = results.map(u => `
      <div class="search-result-item" onclick="openProfile(${u.id}); document.getElementById('search-input').value='';">

        <div><div class="name">${u.name}</div><div class="handle">${u.handle}</div></div>

  });

function openChat(userId) {
  activeChatUserId = userId;
  const user = USERS[userId];
  
  // Create or show chat UI
  let chatContainer = document.getElementById('chat-overlay');
  if (!chatContainer) {
    chatContainer = document.createElement('div');
    chatContainer.id = 'chat-overlay';
    chatContainer.className = 'chat-window-container';
    document.body.appendChild(chatContainer);
  }
  
  chatContainer.innerHTML = `
    <div class="chat-header">
      <img src="${user.avatar}" class="chat-header-avatar" />
      <div class="chat-header-info">
        <div class="chat-header-name">${user.name}</div>
        <div class="chat-header-status">Online</div>
      </div>
      <button class="chat-close" onclick="closeChat()">✕</button>
    </div>
    <div id="chat-messages-body" class="chat-body"></div>
    <div class="chat-footer">
      <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChatMessage()" />
      <button onclick="sendChatMessage()">➤</button>
    </div>
  `;
  
  renderChatMessages();
  chatContainer.classList.add('active');
}

function closeChat() {
  const chatContainer = document.getElementById('chat-overlay');
  if (chatContainer) chatContainer.classList.remove('active');
  activeChatUserId = null;
}

function renderChatMessages() {
  const body = document.getElementById('chat-messages-body');
  if (!body || activeChatUserId === null) return;
  
  const thread = chatMessages.filter(m => 
    (m.fromId === 0 && m.toId === activeChatUserId) || 
    (m.fromId === activeChatUserId && m.toId === 0)
  );
  
  body.innerHTML = thread.map(m => `
    <div class="message-wrapper ${m.fromId === 0 ? 'me' : 'them'}">
      <div class="message-bubble">${m.text}</div>
      <div class="message-time">${m.time}</div>
    </div>
  `).join('');
  
  body.scrollTop = body.scrollHeight;
}

function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || activeChatUserId === null) return;
  
  const now = new Date();
  const timeStr = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
  
  chatMessages.push({
    fromId: 0,
    toId: activeChatUserId,
    text: text,
    time: timeStr
  });
  
  input.value = '';
  renderChatMessages();
  
  // Simulate a quick reply
  setTimeout(() => {
    simulateReply(activeChatUserId);
  }, 1500);
}

function simulateReply(userId) {
  if (activeChatUserId !== userId) return;
  
  const responses = ["That's awesome!", "Cool story!", "Let's meet up later?", "Check this out!", "💯", "Hahaha true."];
  const randomText = responses[Math.floor(Math.random() * responses.length)];
  
  chatMessages.push({
    fromId: userId,
    toId: 0,
    text: randomText,
    time: "Just now"
  });
  
  renderChatMessages();
  toast('💬', `New message from ${USERS[userId].name}`);
}

function openEditProfile() {

// ===== FEED FILTERING LOGIC =====
let currentFilter = 'latest';

function renderFilterTabs() {
  const feed = document.getElementById('feed');
  const existing = document.querySelector('.feed-filter');
  if (existing) return;

  const tabs = document.createElement('div');
  tabs.className = 'feed-filter';
  tabs.innerHTML = `
    <div class="filter-tab active" id="filter-latest" onclick="setFilter('latest')">Latest</div>
    <div class="filter-tab" id="filter-popular" onclick="setFilter('popular')">Popular</div>
  `;
  // Insert after the stories row
  const stories = document.getElementById('stories-row');
  stories.parentNode.insertBefore(tabs, stories.nextSibling);
}

function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`filter-${type}`).classList.add('active');
  
  if (type === 'popular') {
    POSTS.sort((a, b) => b.likes - a.likes);
  } else {
    // Basic sort by ID for 'latest'
    POSTS.sort((a, b) => b.id - a.id);
  }
  renderPosts();
  toast('📊', `Showing ${type} posts first`);
}

function showPostMenu(postId) {
  const post = POSTS.find(p => p.id === postId);
  const existingMenu = document.getElementById(`menu-${postId}`);
  
  if (existingMenu) {
    existingMenu.classList.toggle('open');
    return;
  }

  const menu = document.createElement('div');
  menu.id = `menu-${postId}`;
  menu.className = 'post-menu';
  
  const isOwner = post.userId === 0;

  menu.innerHTML = `
    ${isOwner ? `<div class="menu-item" onclick="deletePost(${postId})">🗑️ Delete Post</div>` : ''}
    <div class="menu-item" onclick="toast('📌', 'Post pinned to profile')">📌 Pin Post</div>
    <div class="menu-item danger" onclick="reportPost(${postId})">⚠️ Report Post</div>
  `;

  document.getElementById(`post-${postId}`).appendChild(menu);
  menu.classList.add('open');
  
  // Close menu when clicking outside
  setTimeout(() => {
    window.onclick = (e) => {
      if (!e.target.closest('.post-menu') && !e.target.closest('.post-more')) {
        menu.classList.remove('open');
      }
    };
  }, 10);
}

function deletePost(postId) {
  if (!confirm("Are you sure you want to delete this post?")) return;
  POSTS = POSTS.filter(p => p.id !== postId);
  renderPosts();
  toast('🗑️', 'Post deleted');
}

function reportPost(postId) {
  const reason = prompt("Why are you reporting this post? (Spam, Harassment, Inappropriate)");
  if (reason) {
    toast('🛡️', 'Thank you. Our team will review this post.');
  }
}

  // ===== SAFETY & ACCOUNT LOGIC =====

let blockedUserIds = [];

function blockUser(userId) {
  if (userId === 0) return toast('⚠️', "You can't block yourself!");
  if (!confirm(`Are you sure you want to block ${USERS[userId].name}?`)) return;

  blockedUserIds.push(userId);
  // Remove their posts from view immediately
  POSTS = POSTS.filter(p => p.userId !== userId);
  renderPosts();
  closeProfile();
  toast('🚫', `${USERS[userId].name} has been blocked.`);
}

function showBlockedList() {
  const modal = document.getElementById('blocked-list-modal');
  if (!modal) {
    const div = document.createElement('div');
    div.id = 'blocked-list-modal';
    document.body.appendChild(div);
  }
  
  const listHTML = blockedUserIds.length > 0 
    ? blockedUserIds.map(id => `
        <div class="settings-item">
          <div>${USERS[id].name}</div>
          <button class="follow-btn" onclick="unblockUser(${id})">Unblock</button>
        </div>`).join('')
    : '<div style="text-align:center; padding:20px; color:var(--muted);">No blocked users</div>';

  document.getElementById('blocked-list-modal').innerHTML = `
    <div class="edit-card">
      <div class="edit-header">Blocked Users <span onclick="document.getElementById('blocked-list-modal').classList.remove('open')" style="cursor:pointer;">✕</span></div>
      ${listHTML}
    </div>
  `;
  document.getElementById('blocked-list-modal').classList.add('open');
}

function unblockUser(userId) {
  blockedUserIds = blockedUserIds.filter(id => id !== userId);
  showBlockedList();
  toast('🔓', 'User unblocked');
}

// ===== VERIFICATION REQUEST =====
function requestVerification() {
  if (USERS[0].verified) return toast('✅', 'You are already verified!');
  
  const handle = prompt("Confirm your handle to request verification:", USERS[0].handle);
  if (handle === USERS[0].handle) {
    toast('⏳', 'Request sent! Our team will review your profile.');
    // Simulation: Grant verification after 5 seconds
    setTimeout(() => {
      USERS[0].verified = true;
      setAvatars();
      renderPosts();
      toast('🌟', 'Congratulations! You are now verified.', 'success');
    }, 5000);
  }
}

function exportUserData() {

  downloadAnchorNode.click();
  downloadAnchorNode.remove();
  
  toast('📂', 'Data export complete!');
}

// ===== POST SCHEDULING LOGIC =====
let scheduledPosts = [];

function openScheduler() {
  const modal = document.getElementById('schedule-modal');
  if (!modal) {
    const div = document.createElement('div');
    div.id = 'schedule-modal';
    document.body.appendChild(div);
  }
  
  document.getElementById('schedule-modal').innerHTML = `
    <div class="schedule-card">
      <div class="edit-header">Schedule Post <span onclick="document.getElementById('schedule-modal').classList.remove('open')" style="cursor:pointer;">✕</span></div>
      <p style="font-size:0.75rem; color:var(--muted);">When should this post go live?</p>
      <input type="datetime-local" id="schedule-time" class="time-input">
      <button class="post-btn" style="width:100%" onclick="confirmSchedule()">Confirm Schedule</button>
    </div>
  `;
  document.getElementById('schedule-modal').classList.add('open');
}

function confirmSchedule() {
  const time = document.getElementById('schedule-time').value;
  const text = document.getElementById('compose-text').value.trim();
  
  if (!time || !text) return toast('⚠️', 'Please provide text and time');

  scheduledPosts.push({ text, time: new Date(time), id: Date.now() });
  
  document.getElementById('compose-text').value = '';
  document.getElementById('schedule-modal').classList.remove('open');
  toast('⏰', `Post scheduled for ${new Date(time).toLocaleString()}`);
  
  // Simulation: Checker loop
  checkScheduledPosts();
}

function checkScheduledPosts() {
  setInterval(() => {
    const now = new Date();
    scheduledPosts.forEach((post, index) => {
      if (now >= post.time) {
        publishScheduledPost(post.text);
        scheduledPosts.splice(index, 1);
      }
    });
  }, 10000); // Check every 10 seconds
}

function publishScheduledPost(text) {
  const newPost = {
    id: nextPostId++, userId: 0, text: text, image: null,
    likes: 0, liked: false, comments: [], time: 'Just now (Scheduled)'
  };
  POSTS.unshift(newPost);
  renderPosts();
  toast('🔔', 'Your scheduled post is now live!');
}

// ===== POLL SYSTEM LOGIC =====
let pollVotes = {}; // Format: { postId: { optionIndex: count } }

function createPollPost() {
  const text = document.getElementById('compose-text').value.trim();
  const optionsInput = prompt("Enter poll options separated by commas (e.g. Yes, No, Maybe):");
  
  if (!text || !optionsInput) return toast('⚠️', 'Poll needs text and options');

  const options = optionsInput.split(',').map(opt => opt.trim()).filter(opt => opt !== "");
  
  const newPost = {
    id: nextPostId++, userId: 0, text: text,
    poll: { options: options, totalVotes: 0 },
    likes: 0, comments: [], time: 'Just now'
  };

  pollVotes[newPost.id] = options.map(() => 0);
  POSTS.unshift(newPost);
  renderPosts();
  document.getElementById('compose-text').value = '';
  toast('📊', 'Poll published!');
}

// Update createPostEl to include this inside the post-body check
function getPollHTML(post) {
  if (!post.poll) return '';
  
  const votes = pollVotes[post.id] || post.poll.options.map(() => 0);
  const total = votes.reduce((a, b) => a + b, 0);

  return `
    <div class="poll-container">
      ${post.poll.options.map((opt, i) => {
        const pct = total === 0 ? 0 : Math.round((votes[i] / total) * 100);
        return `
          <button class="poll-option-btn" onclick="voteInPoll(${post.id}, ${i})">
            <div class="poll-bar" style="width: ${pct}%"></div>
            <span class="poll-percent">${pct}%</span>
            ${opt}
          </button>
        `;
      }).join('')}
      <div style="font-size: 0.7rem; color: var(--muted); margin-top: 4px;">${total} votes</div>
    </div>
  `;
}

function voteInPoll(postId, optionIndex) {
  if (!pollVotes[postId]) return;
  pollVotes[postId][optionIndex]++;
  renderPosts();
  toast('🗳️', 'Vote counted!');
}

function getVoiceMsgHTML(duration) {
  const bars = Array.from({length: 15}, () => Math.floor(Math.random() * 10) + 5);
  return `
    <div class="voice-msg-container">
      <button class="voice-play-btn" onclick="playVoiceSim(this)">▶</button>
      <div class="voice-waveform">
        ${bars.map(h => `<div class="waveform-bar" style="height:${h}px"></div>`).join('')}
      </div>
      <span style="font-size:0.65rem; color:var(--muted);">${duration}</span>
    </div>
  `;
}

function playVoiceSim(btn) {
  const bars = btn.nextElementSibling.children;
  btn.textContent = '⏸';
  let i = 0;
  const interval = setInterval(() => {
    if (i >= bars.length) {
      clearInterval(interval);
      btn.textContent = '▶';
      Array.from(bars).forEach(b => b.classList.remove('active'));
      return;
    }
    bars[i].classList.add('active');
    i++;
  }, 200);
  toast('🔊', 'Playing voice message...');
}

// ===== GROUP CHAT LOGIC =====
let groups = [
  { id: 101, name: "Vibe Devs 💻", members: [0, 1, 3], messages: [] }
];

function openGroupChat(groupId) {
  const group = groups.find(g => g.id === groupId);
  activeChatUserId = null; // Close individual chat state
  
  const chatContainer = document.getElementById('chat-overlay') || createChatOverlay();
  chatContainer.innerHTML = `
    <div class="chat-header">
      <div class="group-avatar-stack">
        ${group.members.map(mId => `<img src="${USERS[mId].avatar}" class="stack-img">`).join('')}
      </div>
      <div class="chat-header-info">
        <div class="chat-header-name">${group.name}</div>
        <div class="chat-header-status">${group.members.length} members</div>
      </div>
      <button class="chat-close" onclick="closeChat()">✕</button>
    </div>
    <div id="chat-messages-body" class="chat-body"></div>
    <div class="chat-footer">
      <input type="text" id="chat-input" placeholder="Message group..." onkeydown="if(event.key==='Enter')sendGroupMessage(${groupId})" />
      <button onclick="sendGroupMessage(${groupId})">➤</button>
    </div>
  `;
  renderGroupMessages(groupId);
  chatContainer.classList.add('active');
}

function sendGroupMessage(groupId) {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  const group = groups.find(g => g.id === groupId);
  group.messages.push({ fromId: 0, text: text, time: "Just now" });
  
  input.value = '';
  renderGroupMessages(groupId);
  
  // Simulation: Someone else replies
  setTimeout(() => {
    const randomMember = group.members.find(m => m !== 0);
    group.messages.push({ fromId: randomMember, text: "Totally agree!", time: "Just now" });
    renderGroupMessages(groupId);
  }, 2000);
}

function renderGroupMessages(groupId) {
  const body = document.getElementById('chat-messages-body');
  const group = groups.find(g => g.id === groupId);
  
  body.innerHTML = group.messages.map(m => `
    <div class="message-wrapper ${m.fromId === 0 ? 'me' : 'them'}">
      ${m.fromId !== 0 ? `<span style="font-size:0.6rem; color:var(--accent); font-weight:700;">${USERS[m.fromId].name}</span>` : ''}
      <div class="message-bubble">${m.text}</div>
      <div class="message-time">${m.time}</div>
    </div>
  `).join('');
  body.scrollTop = body.scrollHeight;
}
