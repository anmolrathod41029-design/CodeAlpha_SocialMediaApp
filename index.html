<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe — Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ===== CSS VARIABLES & RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #13131a;
      --surface2:  #1c1c27;
      --border:    rgba(255,255,255,0.07);
      --text:      #f0f0ff;
      --muted:     #7a7a9a;
      --accent:    #7c6dfa;
      --accent2:   #fa6d9a;
      --accent3:   #6dfac8;
      --grad:      linear-gradient(135deg, #7c6dfa, #fa6d9a);
      --grad2:     linear-gradient(135deg, #6dfac8, #7c6dfa);
      --glow:      0 0 30px rgba(124,109,250,0.25);
      --shadow:    0 8px 32px rgba(0,0,0,0.4);
      --radius:    16px;
      --navbar-h:  64px;
      --sidebar-w: 260px;
      font-family: 'Sora', sans-serif;
    }
    [data-theme="light"] {
      --bg:       #f2f2fa;
      --surface:  #ffffff;
      --surface2: #ebebf8;
      --border:   rgba(0,0,0,0.08);
      --text:     #0f0f1a;
      --muted:    #6b6b8a;
      --shadow:   0 8px 32px rgba(0,0,0,0.1);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

    /* ===== NAVBAR ===== */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--navbar-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: rgba(10,10,15,0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="light"] #navbar { background: rgba(255,255,255,0.7); }

    .nav-logo {
      font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    .nav-search {
      position: relative; flex: 1; max-width: 380px; margin: 0 24px;
    }
    .nav-search input {
      width: 100%; padding: 10px 16px 10px 42px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 99px; color: var(--text); font-family: inherit; font-size: 0.875rem;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .nav-search input:focus { border-color: var(--accent); box-shadow: var(--glow); }
    .nav-search .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; font-size: 1rem;
    }
    #search-dropdown {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; display: none; z-index: 200;
    }
    #search-dropdown.open { display: block; }
    .search-result-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      cursor: pointer; transition: background 0.15s;
    }
    .search-result-item:hover { background: var(--surface2); }
    .search-result-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .search-result-item .name { font-size: 0.875rem; font-weight: 600; }
    .search-result-item .handle { font-size: 0.75rem; color: var(--muted); }

    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface2); border: 1px solid var(--border);
      cursor: pointer; font-size: 1.1rem; transition: all 0.2s;
      color: var(--text); position: relative;
    }
    .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--glow); }
    .notif-badge {
      position: absolute; top: -3px; right: -3px; width: 16px; height: 16px;
      background: var(--accent2); border-radius: 50%; font-size: 0.6rem;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
      color: white; border: 2px solid var(--bg);
    }
    .nav-avatar {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      border: 2px solid transparent;
      background: var(--grad) border-box;
      cursor: pointer; transition: transform 0.2s;
      outline: 2px solid var(--accent);
    }
    .nav-avatar:hover { transform: scale(1.08); }

    /* ===== LAYOUT ===== */
    #app {
      display: flex; padding-top: var(--navbar-h);
      min-height: 100vh; max-width: 1400px; margin: 0 auto;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      position: sticky; top: var(--navbar-h); height: calc(100vh - var(--navbar-h));
      overflow-y: auto; padding: 24px 16px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .sidebar-section-title {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--muted); padding: 0 8px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar-link {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border-radius: 12px; cursor: pointer; font-size: 0.9rem; font-weight: 500;
      transition: all 0.15s; color: var(--muted);
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: var(--surface2); color: var(--text);
    }
    .sidebar-link.active { color: var(--accent); }
    .sidebar-link span { font-size: 1.2rem; }

    .suggested-user { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .suggested-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .suggested-user .info { flex: 1; min-width: 0; }
    .suggested-user .name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggested-user .handle { font-size: 0.75rem; color: var(--muted); }
    .follow-btn {
      padding: 5px 14px; border-radius: 99px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--accent); color: var(--accent);
      background: transparent; font-family: inherit; transition: all 0.2s; white-space: nowrap;
    }
    .follow-btn:hover, .follow-btn.following { background: var(--accent); color: white; }
    .follow-btn.following { background: var(--surface2); border-color: var(--border); color: var(--muted); }

    /* ===== FEED ===== */
    #feed { flex: 1; padding: 24px; max-width: 680px; margin: 0 auto; }

    /* ===== STORIES ===== */
    .stories-row {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px;
      scrollbar-width: none;
    }
    .stories-row::-webkit-scrollbar { display: none; }
    .story-card {
      flex-shrink: 0; width: 72px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .story-ring {
      width: 64px; height: 64px; border-radius: 50%; padding: 2.5px;
      background: var(--grad); transition: transform 0.2s, box-shadow 0.2s;
    }
    .story-ring:hover { transform: scale(1.08); box-shadow: var(--glow); }
    .story-ring.seen { background: var(--surface2); }
    .story-inner { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); }
    .story-name { font-size: 0.68rem; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 72px; }
    .story-add .story-ring { background: var(--surface2); display: flex; align-items: center; justify-content: center; }
    .story-add .story-ring-inner {
      width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg);
      background: var(--surface); display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--accent);
    }

    /* ===== COMPOSER ===== */
    .composer {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .composer-top { display: flex; gap: 12px; }
    .composer-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; outline: 2px solid var(--accent); }
    .composer-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: var(--text);
      font-family: inherit; font-size: 0.925rem; resize: none; outline: none;
      min-height: 80px; transition: border-color 0.2s;
    }
    .composer-input:focus { border-color: var(--accent); }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .composer-tools { display: flex; gap: 4px; }
    .composer-tool { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 8px; font-size: 1.1rem; color: var(--muted); transition: all 0.15s; }
    .composer-tool:hover { background: var(--surface2); color: var(--accent); }
    .post-btn {
      padding: 9px 22px; border-radius: 99px; font-size: 0.875rem; font-weight: 600;
      background: var(--grad); border: none; color: white; cursor: pointer; font-family: inherit;
      transition: opacity 0.2s, transform 0.2s; letter-spacing: 0.3px;
    }
    .post-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .post-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .emoji-row { display: none; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 10px; background: var(--surface2); border-radius: 10px; }
    .emoji-row.open { display: flex; }
    .emoji-pick { cursor: pointer; font-size: 1.3rem; transition: transform 0.15s; }
    .emoji-pick:hover { transform: scale(1.3); }

    /* ===== POST CARD ===== */
    .post {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
      box-shadow: var(--shadow); animation: fadeSlide 0.35s ease both;
    }
    @keyframes fadeSlide { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

    .post-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; }
    .post-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; cursor: pointer; outline: 2px solid var(--accent); transition: transform 0.2s; }
    .post-avatar:hover { transform: scale(1.05); }
    .post-meta { flex: 1; }
    .post-name { font-size: 0.925rem; font-weight: 700; cursor: pointer; }
    .post-name:hover { color: var(--accent); }
    .post-handle { font-size: 0.78rem; color: var(--muted); }
    .post-time { font-size: 0.75rem; color: var(--muted); }
    .post-more { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.3rem; padding: 4px 8px; border-radius: 8px; transition: background 0.15s; }
    .post-more:hover { background: var(--surface2); }
    .post-body { padding: 0 20px 14px; line-height: 1.65; font-size: 0.95rem; }
    .post-body .hashtag { color: var(--accent); cursor: pointer; }
    .post-image { width: 100%; max-height: 480px; object-fit: cover; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity 0.2s; }
    .post-image:hover { opacity: 0.92; }

    .post-actions { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
    .action-btn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; border: none; background: none; cursor: pointer; font-size: 0.85rem; color: var(--muted); font-family: inherit; font-weight: 500; transition: all 0.2s; }
    .action-btn:hover { background: var(--surface2); color: var(--text); }
    .action-btn .icon { font-size: 1.1rem; display: inline-block; transition: transform 0.2s; }
    .action-btn.liked { color: #ff4d6d; }
    .action-btn.liked .icon { animation: heartPop 0.3s ease; }
    @keyframes heartPop { 0%{transform:scale(1)} 50%{transform:scale(1.45)} 100%{transform:scale(1)} }
    .action-btn.bookmarked { color: var(--accent); }
    .spacer { flex: 1; }

    /* Comments */
    .comments-section { padding: 0 20px 16px; display: none; }
    .comments-section.open { display: block; }
    .comment-divider { height: 1px; background: var(--border); margin-bottom: 14px; }
    .comment-item { display: flex; gap: 10px; margin-bottom: 12px; }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .comment-bubble { background: var(--surface2); border-radius: 12px; padding: 8px 12px; flex: 1; font-size: 0.85rem; line-height: 1.5; }
    .comment-bubble .c-name { font-weight: 700; font-size: 0.8rem; margin-bottom: 2px; }
    .comment-input-row { display: flex; gap: 8px; margin-top: 10px; }
    .comment-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 8px 16px; color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s; }
    .comment-send { width: 36px; height: 36px; border-radius: 50%; background: var(--grad); border: none; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; color: white; }

    /* ===== RIGHT PANEL ===== */
    #right-panel { width: 300px; flex-shrink: 0; position: sticky; top: var(--navbar-h); height: calc(100vh - var(--navbar-h)); overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }
    .panel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .panel-card h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 14px; }
    .trend-item { padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .trend-tag { font-size: 0.88rem; font-weight: 600; margin: 2px 0; transition: color 0.15s; }
    .trend-count { font-size: 0.75rem; color: var(--muted); }

    /* ===== TOAST ===== */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; font-size: 0.875rem; min-width: 240px; pointer-events: auto; animation: toastIn 0.3s ease both; }
    @keyframes toastIn { from { opacity:0; transform: translateY(12px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
    .toast.hide { animation: toastOut 0.3s ease forwards; }
    @keyframes toastOut { to { opacity:0; transform: translateY(8px) scale(0.95); } }

    /* ===== MODALS ===== */
    #profile-modal, #story-viewer, #add-story-modal { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    #profile-modal.open, #story-viewer.open, #add-story-modal.open { opacity: 1; pointer-events: all; }
    .modal-card, .story-view-card, .add-story-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 420px; max-width: 95vw; overflow: hidden; box-shadow: var(--shadow); transform: scale(0.92); transition: transform 0.25s; }
    .open .modal-card, .open .story-view-card, .open .add-story-card { transform: scale(1); }

    /* Verified badge */
    .verified { color: var(--accent); font-size: 0.9rem; }

    /* Mobile bottom nav */
    #mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(10,10,15,0.9); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 10px 0 env(safe-area-inset-bottom); justify-content: space-around; }
    @media (max-width: 720px) { #sidebar, #right-panel { display: none; } #mobile-nav { display: flex; } body { padding-bottom: 72px; } .nav-search { max-width: 160px; } }
    .mob-nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.4rem; transition: color 0.15s; padding: 4px 16px; }
    .mob-nav-btn.active { color: var(--accent); }
    .mob-nav-btn span.label { font-size: 0.6rem; font-weight: 600; font-family: 'Sora', sans-serif; }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-logo" onclick="scrollToTop()">Vibe ✦</div>
  <div class="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search people..." autocomplete="off" />
    <div id="search-dropdown"></div>

<div id="app">

  <aside id="right-panel">
    <div class="panel-card">
      <h3>🔥 Trending</h3>

</div>

<div id="mobile-nav">

  <button class="mob-nav-btn" onclick="setMobActive(this); openProfile(0)">👤<span class="label">Profile</span></button>

  {
    id: 2, userId: 2,
    text: "Explored the ancient temples of Kyoto this morning. There's something magical about a place that has stood for centuries 🏯🌸 #travel #japan #photography",
    image: "https://picsum.photos/seed/post2/600/380",
    likes: 512, liked: false,
    comments: [
      { userId: 5, text: "The cherry blossoms are everything! 🌸" },
    ],
    bookmarked: false,
    time: "4h",
  },
];

// ... (Rest of the functions like renderPosts, toggleLike, etc. follow here)
  // Global State
let currentProfileId = null;
let currentStoryIdx = 0;
let storyTimer = null;
let nextPostId = 100;

// ===== INITIALIZE APP =====
function init() {
  setAvatars();
  renderStories();
  renderPosts();
  renderSidebar();
  renderRightPanel();
  initSearch();
  initComposer();
}

function setAvatars() {
  const me = USERS[0];
  document.getElementById('nav-avatar').src = me.avatar;
  document.getElementById('composer-avatar').src = me.avatar;
}

// ===== POSTS LOGIC =====
function renderPosts() {
  const container = document.getElementById('posts-container');
  container.innerHTML = '';
  POSTS.forEach(post => {
    const user = USERS[post.userId];
    const el = document.createElement('div');
    el.className = 'post';
    el.innerHTML = `
      <div class="post-header">
        <img class="post-avatar" src="${user.avatar}" onclick="openProfile(${user.id})" />
        <div class="post-meta">
          <div class="post-name" onclick="openProfile(${user.id})">${user.name}</div>
          <div class="post-handle">${user.handle} · ${post.time}</div>
        </div>
      </div>
      <div class="post-body">${post.text}</div>
      ${post.image ? `<img class="post-image" src="${post.image}" />` : ''}
      <div class="post-actions">
        <button class="action-btn" onclick="toggleLike(${post.id})">❤️ ${post.likes}</button>
        <button class="action-btn">💬 ${post.comments.length}</button>
        <button class="action-btn" onclick="toast('🔗', 'Link copied!')">↗️</button>
      </div>`;
    container.appendChild(el);
  });
}

function publishPost() {
  const ta = document.getElementById('compose-text');
  const text = ta.value.trim();
  if (!text) return;

  const newPost = {
    id: nextPostId++, userId: 0, text: text, image: null,
    likes: 0, liked: false, comments: [], time: 'Just now'
  };

  POSTS.unshift(newPost);
  renderPosts();
  ta.value = '';
  document.getElementById('post-btn').disabled = true;
  toast('🚀', 'Post published!');
}
  function toggleLike(postId) {
  const post = POSTS.find(p => p.id === postId);
  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;
  renderPosts();
  if(post.liked) toast('❤️', 'You liked this!');
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
}

function toast(icon, msg) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function openProfile(id) {
  const u = USERS[id];
  document.getElementById('modal-name').textContent = u.name;
  document.getElementById('modal-handle').textContent = u.handle;
  document.getElementById('modal-bio').textContent = u.bio;
  document.getElementById('modal-avatar').src = u.avatar;
  document.getElementById('profile-modal').classList.add('open');
}

function closeProfile() {
  document.getElementById('profile-modal').classList.remove('open');
}

function initComposer() {
  const ta = document.getElementById('compose-text');
  const btn = document.getElementById('post-btn');
  ta.addEventListener('input', () => btn.disabled = !ta.value.trim());
}

// Final setup functions (empty placeholders to prevent errors)
function renderStories() {} 
function renderSidebar() {} 
function renderRightPanel() {}
function initSearch() {}

// Start the app
init();
</script>
