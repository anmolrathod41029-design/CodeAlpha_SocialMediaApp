<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Digital Workspace</title>
    <style>
        :root {
            --bg-dark: #0d0d12;
            --sidebar-bg: #16161d;
            --accent-purple: #8a2be2;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: var(--sidebar-bg);
            padding: 20px;
            position: fixed;
        }

        /* Story Container Section */
        .main-content {
            margin-left: 270px;
            padding: 20px;
            width: 100%;
        }

        .story-wrapper {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .story-item:hover {
            transform: scale(1.05);
        }

        .ring {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story-item img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--bg-dark);
            object-fit: cover;
        }

        .story-item span {
            font-size: 12px;
            margin-top: 8px;
            color: var(--text-dim);
        }

        /* Story Viewer Modal */
        .story-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .story-viewer.active {
            display: flex;
        }

        #activeStoryImg {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }

        /* Feed Content Placeholder */
        .feed-post {
            max-width: 500px;
            background: var(--sidebar-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>NEXUS</h2>
        <p style="color: var(--accent-purple);">✦ Quantum Feed</p>
        <p>Discover</p>
        <p>Neural Chat</p>
    </nav>

    <div class="main-content">
        <div class="story-wrapper">
            <div class="story-item" onclick="openStory('anmol-full.jpg')">
                <div class="ring"><img src="anmol-thumb.jpg" alt="Anmol"></div>
                <span>Anmol</span>
            </div>
            <div class="story-item" onclick="openStory('jessica-full.jpg')">
                <div class="ring"><img src="jessica-thumb.jpg" alt="Jessica"></div>
                <span>Jessica</span>
            </div>
            <div class="story-item" onclick="openStory('swaraj-full.jpg')">
                <div class="ring"><img src="swaraj-thumb.jpg" alt="Swaraj"></div>
                <span>Swaraj</span>
            </div>
            <div class="story-item" onclick="openStory('rahul-full.jpg')">
                <div class="ring"><img src="rahul-thumb.jpg" alt="Rahul"></div>
                <span>Rahul</span>
            </div>
        </div>

        <div class="feed-post">
            <div style="padding: 10px;"><strong>Swaraj</strong> <span style="font-size: 10px;">Navi Mumbai, IN</span></div>
            <img src="post-image.jpg" style="width: 100%;" alt="Feed Post">
        </div>
    </div>

    <div class="story-viewer" id="storyViewer">
        <span class="close-btn" onclick="closeStory()">&times;</span>
        <img id="activeStoryImg" src="" alt="Full Story">
    </div>

    <script>
        const viewer = document.getElementById('storyViewer');
        const activeImg = document.getElementById('activeStoryImg');

        function openStory(imageSrc) {
            // In a real app, imageSrc would be the path to your high-res upload
            activeImg.src = imageSrc;
            viewer.classList.add('active');
        }

        function closeStory() {
            viewer.classList.remove('active');
            activeImg.src = '';
        }

        // Close on clicking outside the image
        viewer.addEventListener('click', (e) => {
            if (e.target === viewer) closeStory();
        });
    </script>
</body>
</html>
