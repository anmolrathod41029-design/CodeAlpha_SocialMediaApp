<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Social ✦ Dynamic</title>
    <style>
        :root {
            --bg: #f0f2f5; --surf: #ffffff; --text: #1a1a1a; --muted: #65676b;
            --accent: #7c6dfa; --border: #e4e6eb; --grad: linear-gradient(135deg, #7c6dfa, #fa6d9a);
        }
        [data-theme="dark"] {
            --bg: #0b0e11; --surf: #15181c; --text: #f5f5f5; --muted: #a0a0a0; --border: #2f3336;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); transition: 0.3s; overflow-x: hidden; }
        
        nav { height: 60px; background: var(--surf); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top:0; z-index:100; border-bottom: 1px solid var(--border); }
        .app-container { display: grid; grid-template-columns: 240px 1fr 320px; max-width: 1200px; margin: 0 auto; gap: 20px; padding: 20px; }

        /* Stories Row */
        .stories-row { display: flex; gap: 12px; padding: 10px 0; overflow-x: auto; scrollbar-width: none; }
        .story-card { min-width: 70px; cursor: pointer; text-align: center; }
        .story-ring { width: 66px; height: 66px; border-radius: 50%; padding: 3px; background: var(--grad); margin-bottom: 5px; }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--surf); object-fit: cover; }

        /* Post Card */
        .card { background: var(--surf); border-radius: 12px; border: 1px solid var(--border); padding: 15px; margin-bottom: 20px; position: relative; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .post-img { width: 100%; border-radius: 8px; margin: 10px 0; }
        
        /* React Hot Button (Heart Burst) */
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 600; color: var(--muted); transition: 0.2s; }
        .action-btn.liked { color: #f91880; transform: scale(1.1); }
        @keyframes burst {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5) translateY(-20px); opacity: 0; }
        }
        .heart-particle { position: absolute; color: #f91880; pointer-events: none; animation: burst 0.6s ease-out forwards; font-size: 20px; }

        /* Story Viewer Modal */
        .story-modal { position: fixed; inset:0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .story-modal.active { display: flex; }
        .story-content { width: 100%; max-width: 400px; height: 85vh; position: relative; border-radius: 15px; overflow: hidden; }
        .story-content img { width: 100%; height: 100%; object-fit: cover; }
        .progress-bar { position: absolute; top: 10px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,0.3); }
        .progress-fill { height: 100%; background: #fff; width: 0%; }

        @media (max-width: 850px) { .app-container { grid-template-columns: 1fr; } .side { display: none; } }
    </style>
</head>
<body data-theme="light">

<nav>
    <h2 style="background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Vibe ✦</h2>
    <div style="display:flex; gap:15px; align-items:center;">
        <button onclick="toggleTheme()" id="themeBtn" style="background:none; border:none; cursor:pointer; font-size:20px;">🌙</button>
        <img src="https://i.pravatar.cc/150?img=12" class="avatar" style="width:32px; height:32px;">
    </div>
</nav>

<div class="app-container">
    <div class="side">
        <div class="card">
            <p><b>Home</b></p><br><p>Explore</p><br><p>Messages</p>
        </div>
    </div>

    <main>
        <div class="stories-row" id="storyRow"></div>
        
        <div class="card">
            <textarea id="postText" placeholder="What's happening?" style="width:100%; border:none; background:transparent; outline:none; font-size:1.1rem; color:var(--text);"></textarea>
            <hr style="margin:10px 0; opacity:0.1;">
            <div style="display:flex; justify-content:flex-end;">
                <button onclick="createPost()" style="background:var(--grad); color:white; border:none; padding:8px 20px; border-radius:20px; font-weight:600; cursor:pointer;">Post</button>
            </div>
        </div>

        <div id="feed"></div>
    </main>

    <div class="side">
        <div class="card">
            <h4>Suggestions</h4>
            <div id="suggestions" style="margin-top:15px;"></div>
        </div>
    </div>
</div>

<div class="story-modal" id="storyModal" onclick="closeStory()">
    <div class="story-content" onclick="event.stopPropagation()">
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
        <img src="" id="storyImg">
        <div style="position:absolute; bottom:20px; left:20px; color:white;" id="storyCap"></div>
    </div>
</div>

<script>
    const USERS = [
        { id: 0, name: "Me", avatar: "https://i.pravatar.cc/150?img=12", followers: 120 },
        { id: 1, name: "Sarah", avatar: "https://i.pravatar.cc/150?img=32", followers: 450 },
        { id: 2, name: "David", avatar: "https://i.pravatar.cc/150?img=11", followers: 890 }
    ];

    const STORIES = [
        { uId: 1, img: "https://picsum.photos/seed/s1/400/700", cap: "Beach day! 🏖️" },
        { uId: 2, img: "https://picsum.photos/seed/s2/400/700", cap: "New studio setup 🎧" },
        { uId: 1, img: "https://picsum.photos/seed/s3/400/700", cap: "Coffee first ☕" }
    ];

    let POSTS = [
        { id: 101, uId: 1, text: "The future of web design is looking bright! #UIUX", img: "https://picsum.photos/seed/p1/600/400", likes: 24, liked: false }
    ];

    let storyInterval;

    function toggleTheme() {
        const body = document.body;
        const current = body.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', next);
        document.getElementById('themeBtn').innerText = next === 'light' ? '🌙' : '☀️';
    }

    function renderStories() {
        const row = document.getElementById('storyRow');
        row.innerHTML = STORIES.map((s, i) => `
            <div class="story-card" onclick="openStory(${i})">
                <div class="story-ring"><img src="${USERS[s.uId].avatar}"></div>
                <small>${USERS[s.uId].name}</small>
            </div>
        `).join('');
    }

    function openStory(idx) {
        const modal = document.getElementById('storyModal');
        const img = document.getElementById('storyImg');
        const cap = document.getElementById('storyCap');
        const fill = document.getElementById('progFill');
        
        img.src = STORIES[idx].img;
        cap.innerText = STORIES[idx].cap;
        modal.classList.add('active');
        
        let width = 0;
        clearInterval(storyInterval);
        storyInterval = setInterval(() => {
            width += 1;
            fill.style.width = width + '%';
            if(width >= 100) {
                clearInterval(storyInterval);
                closeStory();
            }
        }, 30);
    }

    function closeStory() {
        document.getElementById('storyModal').classList.remove('active');
        clearInterval(storyInterval);
    }

    function renderFeed() {
        const feed = document.getElementById('feed');
        feed.innerHTML = POSTS.map(p => `
            <div class="card">
                <div style="display:flex; gap:10px; align-items:center;">
                    <img src="${USERS[p.uId].avatar}" class="avatar">
                    <b>${USERS[p.uId].name}</b>
                </div>
                <p style="margin:10px 0;">${p.text}</p>
                ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
                <div class="action-btn ${p.liked ? 'liked' : ''}" onclick="handleLike(event, ${p.id})">
                    <span class="heart-icon">${p.liked ? '❤️' : '🤍'}</span> <b>${p.likes}</b>
                </div>
            </div>
        `).join('');
    }

    function handleLike(e, id) {
        const post = POSTS.find(p => p.id === id);
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;

        // Heart Burst Animation
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart-particle';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 600);

        renderFeed();
    }

    function createPost() {
        const txt = document.getElementById('postText');
        if(!txt.value) return;
        POSTS.unshift({ id: Date.now(), uId: 0, text: txt.value, likes: 0, liked: false });
        txt.value = '';
        renderFeed();
    }

    function renderSuggestions() {
        document.getElementById('suggestions').innerHTML = USERS.slice(1).map(u => `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div style="display:flex; gap:10px; align-items:center;">
                    <img src="${u.avatar}" class="avatar" style="width:30px; height:30px;">
                    <div><small><b>${u.name}</b></small><br><small id="count-${u.id}" style="color:var(--muted)">${u.followers} followers</small></div>
                </div>
                <button onclick="follow(${u.id})" style="border:none; color:var(--accent); background:none; font-weight:600; cursor:pointer;">Follow</button>
            </div>
        `).join('');
    }

    function follow(id) {
        const u = USERS.find(x => x.id === id);
        u.followers++;
        document.getElementById(`count-${id}`).innerText = u.followers + " followers";
    }

    renderStories();
    renderFeed();
    renderSuggestions();
</script>
</body>
</html>
