<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus ✦ Infinite Edition</title>
    <style>
        :root {
            --bg: #0b0e14; --surf: #161b22; --text: #f0f6fc; --muted: #8b949e;
            --accent: #58a6ff; --border: #30363d;
            --grad: linear-gradient(135deg, #1d4ed8 0%, #7e22ce 100%);
            --glass: rgba(22, 27, 34, 0.8);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* Layout */
        .app-shell { display: flex; height: 100vh; }
        
        /* Sidebar */
        nav.sidebar { width: 260px; border-right: 1px solid var(--border); padding: 30px 20px; display: flex; flex-direction: column; background: var(--surf); }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 40px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; cursor: pointer; color: var(--muted); transition: 0.3s; margin-bottom: 5px; }
        .nav-item:hover, .nav-item.active { background: var(--border); color: var(--text); }
        .nav-item.active { background: var(--grad); color: white; }

        /* Main Scroll Area */
        main.content { flex: 1; overflow-y: auto; padding: 30px; scrollbar-width: none; }
        .feed-wrap { max-width: 600px; margin: 0 auto; }

        /* Stories */
        .story-bar { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 25px; border-bottom: 1px solid var(--border); margin-bottom: 25px; scrollbar-width: none; }
        .story { min-width: 75px; text-align: center; cursor: pointer; }
        .ring { width: 66px; height: 66px; border-radius: 22px; padding: 2px; background: var(--grad); margin: 0 auto 8px; position: relative; }
        .ring img { width: 100%; height: 100%; border-radius: 20px; border: 3px solid var(--surf); object-fit: cover; }
        .live-badge { position: absolute; top: -5px; right: -5px; background: #ff3e3e; font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }

        /* Post Card */
        .post { background: var(--surf); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 30px; overflow: hidden; }
        .post-header { padding: 15px; display: flex; align-items: center; gap: 12px; }
        .post-header img { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; }
        .post-info b { display: block; font-size: 14px; }
        .post-info span { font-size: 11px; color: var(--muted); }
        .post-img { width: 100%; max-height: 550px; object-fit: cover; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: crosshair; }
        .post-actions { padding: 15px; display: flex; gap: 20px; font-size: 22px; }
        .post-actions span { cursor: pointer; transition: 0.2s; }
        .post-actions span:hover { transform: scale(1.2); }
        
        /* Comment System */
        .comment-box { padding: 0 15px 15px; display: none; border-top: 1px solid var(--border); pt: 10px; }
        .comment-box.active { display: block; }
        .comment-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; font-size: 13px; }
        .comment-input-area { display: flex; gap: 10px; }
        .comment-input-area input { flex: 1; background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 10px; color: white; outline: none; }

        /* Messages Panel */
        .chat-panel { position: fixed; right: -400px; top: 0; width: 350px; height: 100vh; background: var(--surf); border-left: 1px solid var(--border); transition: 0.4s; z-index: 2000; padding: 25px; }
        .chat-panel.open { right: 0; }
        .chat-bubble { background: var(--bg); padding: 10px 15px; border-radius: 15px; margin-bottom: 15px; font-size: 14px; border-left: 3px solid var(--accent); }
        .my-chat { background: var(--grad); color: white; text-align: right; border-left: none; border-right: 3px solid white; }

        /* Toast */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--grad); color: white; padding: 12px 25px; border-radius: 50px; display: none; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="app-shell">
    <nav class="sidebar">
        <div class="logo">NEXUS ✦</div>
        <div class="nav-item active" onclick="showSection('feed')">🏠 Quantum Feed</div>
        <div class="nav-item" onclick="showToast('Explore Mode Activated')">🚀 Discover</div>
        <div class="nav-item" onclick="toggleChat()">⚡ Neural Chat</div>
        <div class="nav-item" onclick="showToast('Identity Settings Loaded')">💎 Edit Workspace</div>
    </nav>

    <main class="content">
        <div class="feed-wrap">
            <div class="story-bar" id="storyRow"></div>
            
            <div style="background: var(--surf); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 30px;">
                <textarea id="postInp" placeholder="What's your current frequency, Anmol?" style="width:100%; background:transparent; border:none; color:white; outline:none; font-size:16px; resize:none;"></textarea>
                <div style="display:flex; justify-content:space-between; margin-top:15px;">
                    <span style="cursor:pointer;" onclick="showToast('Gallery Access Granted')">📸 Photo</span>
                    <button onclick="publish()" style="background:var(--grad); color:white; border:none; padding:8px 20px; border-radius:10px; cursor:pointer; font-weight:bold;">EMIT</button>
                </div>
            </div>

            <div id="feed"></div>
        </div>
    </main>
</div>

<div class="chat-panel" id="chatPanel">
    <h3 style="margin-bottom:20px;">Messages</h3>
    <div id="chatHistory" style="height: 80vh; overflow-y: auto;"></div>
    <div style="display:flex; gap:10px;">
        <input type="text" id="msgInp" placeholder="Send 'Good Morning'..." style="flex:1; padding:10px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:white;">
        <button onclick="sendMsg()" style="background:var(--grad); border:none; padding:10px; border-radius:10px; color:white; cursor:pointer;">➔</button>
    </div>
</div>

<div id="toast"></div>

<script>
    const USERS = [
        {id:0, name:"Anmol", city:"Mumbai, IN", avatar:"https://i.pravatar.cc/150?u=me", live:true},
        {id:1, name:"Jessica", city:"New York, US", avatar:"https://i.pravatar.cc/150?u=1", live:true},
        {id:2, name:"Swaraj", city:"Navi Mumbai, IN", avatar:"https://i.pravatar.cc/150?u=2", live:true},
        {id:3, name:"Rahul", city:"Delhi, IN", avatar:"https://i.pravatar.cc/150?u=3", live:false},
        {id:4, name:"Elena", city:"Paris, FR", avatar:"https://i.pravatar.cc/150?u=4", live:false},
        {id:5, name:"Marcus", city:"Berlin, DE", avatar:"https://i.pravatar.cc/150?u=5", live:true}
    ];

    let POSTS = [
        {id:1, uId:2, img:"https://picsum.photos/seed/swaraj/800/800", txt:"Neural Networks are the future of connectivity. 🧠", likes:124, liked:false, comments:[]},
        {id:2, uId:5, img:"https://picsum.photos/seed/marcus/800/800", txt:"Architecture redefined in the digital age. 🏛️", likes:89, liked:false, comments:[]},
        {id:3, uId:1, img:"https://picsum.photos/seed/nyc/800/800", txt:"Times Square magic! 🗽", likes:450, liked:false, comments:[]},
        {id:4, uId:4, img:"https://picsum.photos/seed/paris/800/800", txt:"Parisian mornings... ☕", likes:312, liked:false, comments:[]}
    ];

    function render() {
        document.getElementById('storyRow').innerHTML = USERS.map(u => `
            <div class="story">
                <div class="ring"><img src="${u.avatar}">${u.live?'<span class="live-badge">LIVE</span>':''}</div>
                <small style="font-size:11px;">${u.name}</small>
            </div>
        `).join('');

        document.getElementById('feed').innerHTML = POSTS.map(p => {
            const u = USERS.find(x => x.id === p.uId);
            return `
                <div class="post">
                    <div class="post-header">
                        <img src="${u.avatar}">
                        <div class="post-info"><b>${u.name}</b><span>${u.city}</span></div>
                    </div>
                    <img src="${p.img}" class="post-img" ondblclick="like(${p.id})">
                    <div class="post-actions">
                        <span onclick="like(${p.id})">${p.liked?'❤️':'🤍'}</span>
                        <span onclick="toggleComments(${p.id})">💬</span>
                        <span onclick="sharePost('${p.txt}')">✈️</span>
                        <span style="margin-left:auto" onclick="savePost(${p.id})">📑</span>
                    </div>
                    <div style="padding:0 15px 10px;"><b>${u.name}</b> ${p.txt}</div>
                    <div class="comment-box" id="cb-${p.id}">
                        <div class="comment-list" id="cl-${p.id}">${p.comments.map(c => `<div><b>You:</b> ${c}</div>`).join('')}</div>
                        <div class="comment-input-area">
                            <input type="text" id="ci-${p.id}" placeholder="Good or something like that...">
                            <button onclick="addComment(${p.id})" style="background:none; border:none; color:var(--accent); font-weight:bold; cursor:pointer;">Post</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function like(id) {
        const p = POSTS.find(x => x.id === id);
        p.liked = !p.liked;
        showToast(p.liked ? 'Neural Pulse ❤️' : 'Pulse Removed');
        render();
    }

    function toggleComments(id) {
        const box = document.getElementById(`cb-${id}`);
        box.classList.toggle('active');
    }

    function addComment(id) {
        const input = document.getElementById(`ci-${id}`);
        if(!input.value) return;
        const p = POSTS.find(x => x.id === id);
        p.comments.push(input.value);
        input.value = '';
        render();
        showToast('Comment Emitted ⚡');
    }

    function sharePost(txt) {
        if (navigator.share) {
            navigator.share({ title: 'Nexus Social', text: txt, url: window.location.href });
        } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
        }
    }

    function savePost(id) {
        showToast('Post Saved to Collective 📑');
    }

    function publish() {
        const val = document.getElementById('postInp').value;
        if(!val) return;
        POSTS.unshift({id:Date.now(), uId:0, img:"https://picsum.photos/seed/"+Math.random()+"/800/800", txt:val, liked:false, comments:[]});
        document.getElementById('postInp').value = '';
        render();
        showToast('Quantum Emission Success ⚡');
    }

    // --- Chat Logic ---
    const chatHistory = [
        {name: "Jessica", msg: "Hey Anmol, how are you?"},
        {name: "Swaraj", msg: "Good Morning! Did you check the new design?"}
    ];

    function toggleChat() { document.getElementById('chatPanel').classList.toggle('open'); renderChat(); }

    function renderChat() {
        document.getElementById('chatHistory').innerHTML = chatHistory.map(c => `
            <div class="chat-bubble ${c.name === 'You' ? 'my-chat' : ''}">
                <b>${c.name}</b><br>${c.msg}
            </div>
        `).join('');
    }

    function sendMsg() {
        const inp = document.getElementById('msgInp');
        if(!inp.value) return;
        chatHistory.push({name: "You", msg: inp.value});
        const reply = inp.value;
        inp.value = '';
        renderChat();
        if(reply.toLowerCase().includes('morning')) {
            setTimeout(() => {
                chatHistory.push({name: "Jessica", msg: "Good Morning! Have a great day ahead! ✨"});
                renderChat();
            }, 1000);
        }
    }

    function showToast(m) { const t = document.getElementById('toast'); t.innerHTML = m; t.style.display = 'block'; setTimeout(()=>t.style.display='none',3000); }

    render();
</script>
</body>
</html>
