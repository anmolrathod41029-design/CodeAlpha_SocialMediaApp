<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Social ✦ Pro</title>
    <style>
        :root {
            --bg: #fafafa; --surf: #ffffff; --text: #262626; --muted: #8e8e8e;
            --accent: #0095f6; --border: #dbdbdb; --grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --glass: rgba(255, 255, 255, 0.9);
        }
        [data-theme="dark"] {
            --bg: #000000; --surf: #121212; --text: #ffffff; --muted: #a8a8a8; --border: #262626; --glass: rgba(0, 0, 0, 0.8);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); transition: 0.3s; }

        /* Layout */
        .app-wrapper { display: flex; max-width: 1200px; margin: 0 auto; height: 100vh; position: relative; }
        
        /* Left Sidebar (Desktop) */
        nav.sidebar { width: 240px; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; }
        .logo { font-size: 24px; font-weight: bold; font-style: italic; margin-bottom: 30px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .nav-item:hover { background: rgba(0,0,0,0.05); }

        /* Main Feed */
        main.feed-container { flex: 1; overflow-y: auto; padding: 30px 50px; scrollbar-width: none; }
        
        /* Stories */
        .stories-container { display: flex; gap: 15px; margin-bottom: 30px; padding: 10px 0; }
        .story-circle { width: 75px; flex-shrink: 0; cursor: pointer; text-align: center; }
        .ring { width: 66px; height: 66px; border-radius: 50%; padding: 2px; background: var(--grad); margin: 0 auto 5px; position: relative; }
        .ring img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg); object-fit: cover; }
        .story-circle.seen .ring { background: var(--border); }
        .story-circle small { font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; }

        /* Thoughts (Notes) */
        .thoughts-bubble { background: var(--surf); border: 1px solid var(--border); padding: 8px 12px; border-radius: 20px; font-size: 12px; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: max-content; max-width: 80px; white-space: nowrap; overflow: hidden; }

        /* Post Card */
        .post-card { background: var(--surf); border-bottom: 1px solid var(--border); margin-bottom: 30px; padding-bottom: 20px; }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .post-media { width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
        .post-media img { width: 100%; display: block; }
        .post-actions { display: flex; gap: 15px; padding: 12px 0; font-size: 20px; }
        .post-actions span { cursor: pointer; transition: 0.2s; }
        .post-actions span:hover { transform: scale(1.1); }

        /* Modals */
        .modal { position: fixed; inset:0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .story-view { width: 100%; max-width: 380px; height: 85vh; position: relative; border-radius: 10px; overflow: hidden; }
        .story-view img { width: 100%; height: 100%; object-fit: cover; }
        .prog-bar { position: absolute; top: 10px; left: 10px; right: 10px; height: 2px; background: rgba(255,255,255,0.3); }
        .prog-fill { height: 100%; background: #fff; width: 0%; }

        /* Bottom Nav (Mobile) */
        .bottom-nav { display: none; position: fixed; bottom: 0; width: 100%; background: var(--surf); border-top: 1px solid var(--border); justify-content: space-around; padding: 10px; z-index: 1000; }

        /* Profile Editor */
        .editor-container { background: var(--surf); padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; color: var(--text); }
        .editor-container input, .editor-container textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }

        @media (max-width: 768px) {
            nav.sidebar { display: none; }
            .bottom-nav { display: flex; }
            main.feed-container { padding: 15px; }
        }
    </style>
</head>
<body data-theme="light">

<div class="app-wrapper">
    <nav class="sidebar">
        <div class="logo">TITAN ✦</div>
        <div class="nav-item" onclick="location.reload()">🏠 Home</div>
        <div class="nav-item" onclick="showToast('Explore Feed Coming Soon!')">🔍 Explore</div>
        <div class="nav-item" onclick="openMessages()">💬 Messages</div>
        <div class="nav-item" onclick="openEditor()">⚙️ Edit Profile</div>
        <div class="nav-item" onclick="toggleTheme()">🌓 Toggle Mode</div>
    </nav>

    <main class="feed-container">
        <div class="stories-container" id="storyRow"></div>

        <div style="background: var(--surf); padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px;">
            <textarea id="myThought" placeholder="Share a thought..." style="width:100%; background:transparent; border:none; outline:none; color:var(--text); resize:none;"></textarea>
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <input type="file" id="postImgInp" style="display:none" onchange="createPost(event)">
                <button onclick="document.getElementById('postImgInp').click()" style="background:none; border:none; cursor:pointer;">🖼️ Photo</button>
                <button onclick="createPost()" style="background:var(--accent); color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Share</button>
            </div>
        </div>

        <div id="feed"></div>
    </main>
</div>

<div class="bottom-nav">
    <span onclick="location.reload()">🏠</span>
    <span onclick="showToast('Search active')">🔍</span>
    <span onclick="openMessages()">💬</span>
    <span onclick="openEditor()">👤</span>
</div>

<div class="modal" id="storyModal" onclick="closeStory()">
    <div class="story-view" onclick="event.stopPropagation()">
        <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
        <img id="modalImg" src="">
        <div id="modalCap" style="position:absolute; bottom:30px; left:20px; color:white; text-shadow: 1px 1px 5px #000; font-weight:bold;"></div>
    </div>
</div>

<div class="modal" id="editorModal">
    <div class="editor-container">
        <h3>Edit Profile</h3>
        <label>Name</label><input type="text" id="editName" value="Titan User">
        <label>Bio</label><textarea id="editBio">Exploring the Titan Social...</textarea>
        <button onclick="saveProfile()" style="background:var(--accent); color:white; border:none; padding:10px; width:100%; border-radius:5px; cursor:pointer;">Update Profile</button>
        <button onclick="closeModals()" style="background:none; border:none; width:100%; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<div id="toast" style="position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:10px 20px; border-radius:20px; display:none; z-index:9999;"></div>

<script>
    // Expanded Database
    const USERS = [
        { id: 0, name: "You", handle: "@me", avatar: "https://i.pravatar.cc/150?img=12", note: "Feeling lucky! 🍀" },
        { id: 1, name: "Jessica Smith", handle: "@jess_smith", avatar: "https://i.pravatar.cc/150?img=32", note: "Working late ☕" },
        { id: 2, name: "Marco V", handle: "@marco_v", avatar: "https://i.pravatar.cc/150?img=11", note: "Hiking vibes ⛰️" },
        { id: 3, name: "Arya Stark", handle: "@arya_s", avatar: "https://i.pravatar.cc/150?img=44", note: "Winter is coming" },
        { id: 4, name: "Professor X", handle: "@charles", avatar: "https://i.pravatar.cc/150?img=68", note: "Mind reading mode" }
    ];

    const STORIES = [
        { uId: 1, img: "https://picsum.photos/seed/s1/400/700", cap: "Morning coffee rituals" },
        { uId: 2, img: "https://picsum.photos/seed/s2/400/700", cap: "The climb was worth it!" },
        { uId: 3, img: "https://picsum.photos/seed/s3/400/700", cap: "New project alert!" },
        { uId: 4, img: "https://picsum.photos/seed/s4/400/700", cap: "Back in the academy" }
    ];

    let POSTS = [
        { id: 1, uId: 1, text: "Just landed in Tokyo! 🇯🇵 The lights are incredible.", img: "https://picsum.photos/seed/t1/600/600", likes: 1402, liked: false },
        { id: 2, uId: 3, text: "New sword training today. Skills getting better! ⚔️", img: "https://picsum.photos/seed/t2/600/600", likes: 231, liked: false }
    ];

    let storyTimer;

    function renderUI() {
        // Render Stories
        const storyRow = document.getElementById('storyRow');
        storyRow.innerHTML = USERS.map(u => {
            const hasStory = STORIES.findIndex(s => s.uId === u.id);
            if (hasStory === -1 && u.id !== 0) return ''; // Only show users with stories
            return `
                <div class="story-circle" onclick="openStory(${hasStory})">
                    <div class="ring">
                        ${u.note ? `<div class="thoughts-bubble">${u.note}</div>` : ''}
                        <img src="${u.avatar}">
                    </div>
                    <small>${u.id === 0 ? 'Your Story' : u.name.split(' ')[0]}</small>
                </div>`;
        }).join('');

        // Render Feed
        const feed = document.getElementById('feed');
        feed.innerHTML = POSTS.map(p => `
            <div class="post-card">
                <div class="post-header">
                    <div class="user-info">
                        <img src="${USERS[p.uId].avatar}">
                        <b>${USERS[p.uId].name}</b>
                    </div>
                    <span>⋮</span>
                </div>
                ${p.img ? `<div class="post-media"><img src="${p.img}"></div>` : ''}
                <div class="post-actions">
                    <span onclick="likePost(${p.id})">${p.liked ? '❤️' : '🤍'}</span>
                    <span onclick="showToast('Comments disabled')">💬</span>
                    <span onclick="showToast('Shared!')">✈️</span>
                </div>
                <p><b>${USERS[p.uId].name}</b> ${p.text}</p>
                <small style="color:var(--muted); font-size:10px;">JUST NOW</small>
            </div>`).join('');
    }

    function openStory(idx) {
        if (idx === -1) { showToast("You haven't added a story yet!"); return; }
        const modal = document.getElementById('storyModal');
        const fill = document.getElementById('progFill');
        document.getElementById('modalImg').src = STORIES[idx].img;
        document.getElementById('modalCap').innerText = STORIES[idx].cap;
        modal.classList.add('active');

        let w = 0;
        clearInterval(storyTimer);
        storyTimer = setInterval(() => {
            w += 1;
            fill.style.width = w + '%';
            if (w >= 100) closeStory();
        }, 40);
    }

    function closeStory() {
        document.getElementById('storyModal').classList.remove('active');
        clearInterval(storyTimer);
    }

    function createPost(event) {
        const text = document.getElementById('myThought').value;
        let img = null;
        if (event && event.target.files[0]) {
            img = URL.createObjectURL(event.target.files[0]);
        }
        if (!text && !img) return;
        POSTS.unshift({ id: Date.now(), uId: 0, text: text, img: img, likes: 0, liked: false });
        document.getElementById('myThought').value = '';
        renderUI();
        showToast('Vibe Shared! ✨');
    }

    function openMessages() {
        showToast('💬 Jessica: "Hey! How are you?" <br> 💬 Marco: "Good Morning!"');
    }

    function openEditor() { document.getElementById('editorModal').classList.add('active'); }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

    function saveProfile() {
        USERS[0].name = document.getElementById('editName').value;
        showToast('Profile Updated! 👤');
        closeModals();
        renderUI();
    }

    function likePost(id) {
        const p = POSTS.find(x => x.id === id);
        p.liked = !p.liked;
        p.likes += p.liked ? 1 : -1;
        renderUI();
    }

    function toggleTheme() {
        const body = document.body;
        const next = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', next);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerHTML = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    renderUI();
</script>
</body>
</html>
